spring.application.name=api-gateway
server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webmvc.routes[0].id=usuarios
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://usuarios-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/usuarios/**,/api/roles/**

spring.cloud.gateway.server.webmvc.routes[1].id=equipos
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://equipos-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/equipos/**,/api/instalaciones/**,/api/regiones/**,/api/comunas/**,/api/tipos-equipo/**

spring.cloud.gateway.server.webmvc.routes[2].id=protocolos
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://protocolos-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/protocolos/**,/api/visitas/**,/api/instrumentos/**,/api/tipos-prueba/**

spring.cloud.gateway.server.webmvc.routes[3].id=reportes
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://reportes-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/reportes/**
